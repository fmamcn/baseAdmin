<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>登录 - 网站后台管理系统</title>
    <link href="__STATIC__/layui/css/layui.css" rel="stylesheet">
    <link href="__ADMIN__/css/app.css?{:time()}" rel="stylesheet">
</head>
<body class="logn-body">
<div class="login">
    <div class="login-form">
        <div class="logn-logo"><img src="__ADMIN__/images/logo.png"></div>
        <form class="layui-form" action="{:request()->url()}" method="post">
            <div class="input">
                <input name="username" type="text" required /><i class="layui-icon layui-icon-username"></i><label>账号</label>
            </div>
            <div class="input">
                <input name="password" type="password" required /><i class="layui-icon layui-icon-password"></i><label>密码</label>
            </div>
            <div class="input">
                <input type="text" name="captcha" required><i class="layui-icon layui-icon-vercode"></i><label>验证码</label>
                <img src="{:url('admin/index/captcha')}" class="captcha" onclick="this.src='{:url('admin/index/captcha')}?rand='+Math.random()">
            </div>
            <button class="layui-btn layui-btn-fluid layui-btn-radius" style="height:40px" lay-submit lay-filter="J-form">登录</button>
        </form>
    </div>
    <div class="login-img">
        <img src="__ADMIN__/images/login-form.jpg">
        <div class="footer">
            Copyright &copy; {:date('Y')}
        </div>
    </div>    
</div>
<script src="__STATIC__/layui/layui.js"></script>
<script src="__ADMIN__/js/app.js?{:time()}"></script>
<script type="text/javascript">
if(window.parent != window){
    window.parent.location.reload(true);
}
</script>
</body>
</html>
