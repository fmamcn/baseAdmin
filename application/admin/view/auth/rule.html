{extend name="base" /}
{block name="body"}
<div class="container">
    <div class="tools">
        <div class="tool-btn">
            <a data-href="{:url('admin/auth/addRule')}" class="layui-btn T-modal"><i class="layui-icon layui-icon-add-1"></i> 添加规则</a>
        </div>        
    </div>
    <div class="container-main">
        <table class="layui-table layui-form">
            <thead>
                <tr>
                    <th width="40">排序</th>
                    <th width="40">ID</th>
                    <th width="200">名称</th>
                    <th width="250">规则</th>
                    <th width="70">是否菜单</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {volist name="authRule" id="vo"}
                <tr>
                    <td><input type="text" name="sort_order" value="{$vo.sort_order}" data-href="{:url('admin/auth/editRule', ['id' => $vo.id])}" class="layui-input T-update"></td>
                    <td>{$vo.id}</td>
                    <td>{$vo.name}</td>
                    <td>{$vo.url}</td>
                    <td>{if $vo.type eq 'nav'}<i class="layui-icon layui-icon-ok-circle layui-font-green"></i>{else /}<i class="layui-icon layui-icon-subtraction layui-font-gray"></i>{/if}</td>
                    <td class="layui-clear-space barBtn">
                        <a data-href="{:url('addRule', ['pid'=>$vo.id])}" class="add T-modal">添加子类</a>
                        <a data-href="{:url('editRule', ['id'=>$vo.id])}" class="edit T-modal">编辑</a>
                        <a data-href="{:url('delRule', ['id'=>$vo.id])}" class="del T-del">删除</a>
                    </td>
                </tr>
                {/volist}
            </tbody>
        </table>
    </div>
</div>
{/block}
