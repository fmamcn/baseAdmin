{extend name="base" /}
{block name="body"}
<div class="container" style="min-height:300px">
    <table class="layui-table">
        <thead>
            <tr>
                <th width="150">备份文件</th>
                <th width="60">卷数</th>
                <th width="60">大小</th>
                <th width="140">备份时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {foreach name="list" item="v" empty="$empty"}
            <tr>
                <td>{$v.time|date='Ymd-His',###}</td>
                <td>{$v.part}</td>
                <td>{$v.size|format_bytes}</td>
                <td>{$key}</td>
                <td  class="layui-clear-space barBtn">
                    <a href="{:url('admin/database/download', ['time' => $v.time])}" class="add">下载</a>
                    <a data-href="{:url('admin/database/import', ['time' => $v.time])}" class="edit T-action">还原</a>
                    <a data-href="{:url('admin/database/del', ['time' => $v.time])}" class="del T-del">删除</a>
                </td>
            </tr>
            {/foreach}
        </tbody>
    </table>
</div>
{/block}
