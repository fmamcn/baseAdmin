{extend name="base" /}
{block name="body"}
<div class="container">
    <div class="tools">
        <div class="tool-btn layui-btn-group">
            <a data-href="{:url('admin/database/backup')}" class="layui-btn layui-bg-red T-batch"><i class="layui-icon layui-icon-layer"></i> 立即备份</a>
            <a data-href="{:url('admin/database/optimize')}" class="layui-btn layui-bg-blue T-batch"><i class="layui-icon layui-icon-refresh"></i> 批量优化</a>
            <a data-href="{:url('admin/database/repair')}" class="layui-btn layui-bg-orange T-batch"><i class="layui-icon layui-icon-chart"></i> 批量修复</a>
            <a data-href="{:url('admin/database/import')}" class="layui-btn T-modal"><i class="layui-icon layui-icon-list"></i> 数据列表</a>
        </div>        
    </div>
    <div class="container-main">
        <table class="layui-table layui-form">
            <thead>
                <tr>
                    <th width="20"><input type="checkbox" lay-skin="primary" lay-filter="all" checked="chedked"></th>
                    <th width="150">表名</th>
                    <th width="70">类型</th>
                    <th width="70">记录</th>
                    <th width="70">大小</th>
                    <th width="120">备注</th>
                    <th width="140">创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {foreach name="list" item="v" empty="$empty"}
                <tr>
                    <td><input type="checkbox" name="table" value="{$v.name}" lay-skin="primary" checked="chedked"></td>
                    <td>{$v.name}</td>
                    <td>{$v.engine}</td>
                    <td>{$v.rows}</td>
                    <td>{$v.data_length|format_bytes}</td>
                    <td>{$v.comment}</td>
                    <td>{$v.create_time}</td>
                    <td class="layui-clear-space barBtn">
                        <a data-href="{:url('admin/database/optimize', ['table' => $v.name])}" class="add T-action">优化</a>
                        <a data-href="{:url('admin/database/repair', ['table' => $v.name])}" class="edit T-action">修复</a>
                    </td>
                </tr>
                {/foreach}
            </tbody>
        </table>
    </div>
</div>
{/block}
